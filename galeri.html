<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poto Aku & Kamu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital@1&display=swap');

  :root{
    --navy-deep: #060a1a;
    --navy: #0e1630;
    --indigo: #1c2a56;
    --periwinkle: #93a9ff;
    --moon-cream: #ffe9c4;
    --blush: #ff8fab;
    --lavender-text: #dbdff2;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height:auto; min-height:100%; margin:0; }

  body{
    font-family:'Quicksand', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--indigo), var(--navy) 45%, var(--navy-deep) 100%);
    color: var(--lavender-text);
    min-height:100vh;
    padding: 22px 16px 40px;
    display:flex;
    justify-content:center;
  }

  .stage{ width:100%; max-width:430px; }

  .top-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
  }
  .back-btn{
    width:38px; height:38px;
    border-radius:12px;
    background: var(--glass);
    border:1px solid var(--glass-border);
    color:#fff;
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn:active{ transform:scale(0.94); }

  h1{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:400;
    font-size:24px;
    color: var(--moon-cream);
    margin:0;
  }

  .section-title{
    font-size:15px;
    font-weight:600;
    color: var(--periwinkle);
    margin: 26px 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title:first-of-type{ margin-top:6px; }

  .gallery{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .photo-card{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    aspect-ratio: 4/5;
    background: var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .photo-card img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .footer-note{
    text-align:center;
    margin-top:30px;
    font-size:12.5px;
    color: rgba(219,223,242,0.55);
  }
  .footer-note .heart{ color: var(--blush); }
</style>
</head>

    // acak urutan kartu foto di setiap galeri (Poto Aku & Poto Kamu terpisah)
    document.querySelectorAll('.gallery').forEach(function(galeri){
      const kartu = Array.from(galeri.children);
      for(let i = kartu.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [kartu[i], kartu[j]] = [kartu[j], kartu[i]];
      }
      kartu.forEach(function(el){ galeri.appendChild(el); });
    });
  </script>
</body>
</html>
